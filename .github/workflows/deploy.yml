name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install CMake 3.31
        run: |
          wget -q https://github.com/Kitware/CMake/releases/download/v3.31.6/cmake-3.31.6-linux-x86_64.tar.gz
          tar -xzf cmake-3.31.6-linux-x86_64.tar.gz -C /opt
          echo "/opt/cmake-3.31.6-linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Cache Emscripten
        uses: actions/cache@v4
        with:
          path: ~/emsdk
          key: emsdk-6.0.9-v1

      - name: Install Emscripten
        run: |
          if [ ! -d ~/emsdk/.git ]; then
            rm -rf ~/emsdk
            git clone --depth 1 https://github.com/emscripten-core/emsdk.git ~/emsdk
          fi
          ~/emsdk/emsdk install 6.0.9
          ~/emsdk/emsdk activate 6.0.9

      - name: Build single-file WASM
        run: |
          source ~/emsdk/emsdk_env.sh
          cmake -S . -B build-wasm -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$EMSDK/upstream/emscripten/cmake/Modules/Platform/Emscripten.cmake"
          cmake --build build-wasm --target ss_single

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build-wasm/single

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
